# Solo backend. No crea otra base ni ejecuta migraciones/semillas al arrancar.
services:
  - type: web
    name: gymbro-api
    runtime: node
    branch: render
    plan: free
    region: virginia
    buildCommand: npm ci --omit=dev --workspace backend
    startCommand: npm run start --workspace backend
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DB_CONNECTION_MODE
        value: SUPABASE
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        value: https://localhost
      - key: GEMINI_ENABLED
        value: false
