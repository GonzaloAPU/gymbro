services:
  postgres:
    image: postgres:17-alpine
    environment:
       
      POSTGRES_DB: smartgymbro
      POSTGRES_USER: smartgymbro
      POSTGRES_PASSWORD: smartgymbro
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    #healthcheck:
    # test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smartgymbro} -d ${POSTGRES_DB:-smartgymbro}"]
    #  interval: 5s
    #  timeout: 5s
    #  retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@smartgymbro.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-smartgymbro}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres

volumes:
  postgres_data:
  pgadmin_data:
