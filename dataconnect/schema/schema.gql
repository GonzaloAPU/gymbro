# Prueba aislada: no contiene cuentas, contraseñas, fotos ni datos reales existentes.
# @table genera una tabla; UUID identifica filas y @default crea el ID si no se proporciona.
type Exercise @table {
  id: UUID! @default(expr: "uuidV4()")
  name: String!
  muscleGroup: String!
  equipment: String!
  movementPattern: String
  trainingType: String!
}

type Routine @table {
  id: UUID! @default(expr: "uuidV4()")
  name: String!
  goal: String!
}

# Campos Routine! y Exercise! expresan relaciones obligatorias con otras tablas.
type RoutineItem @table {
  id: UUID! @default(expr: "uuidV4()")
  routine: Routine!
  exercise: Exercise!
  position: Int!
  sets: Int!
  minReps: Int!
  maxReps: Int!
}

type RoutineSchedule @table {
  id: UUID! @default(expr: "uuidV4()")
  routine: Routine!
  weekday: Int!
  start: String!
  end: String!
}
