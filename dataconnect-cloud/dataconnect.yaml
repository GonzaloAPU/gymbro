# Servicio real. La prueba local conserva su configuración en dataconnect/.
specVersion: "v1beta"
serviceId: "gymbro-569e3-service"
location: "southamerica-east1"
schema:
  source: "./schema"
  datasource:
    postgresql:
      database: "gymbro-569e3-database"
      # Base existente administrada por Sequelize. publish-cloud-schema.cjs
      # utiliza schemaValidation=NONE en la API para no migrar estas tablas.
      # La CLI no admite escribir NONE en YAML; publicar con ese script.
      cloudSql:
        instanceId: "gymbro-569e3-instance"
connectorDirs: ["./admin"]
