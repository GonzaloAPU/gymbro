# La base completa se importa sin cambiar las tablas ni tipos de Sequelize.
# Esta primera superficie GraphQL solo describe el catálogo, no usuarios ni hashes.
type Exercise @table(name: "exercises") {
  id: UUID!
  name: String! @col(dataType: "varchar(255)")
  muscleGroup: String! @col(name: "muscle_group", dataType: "varchar(255)")
  equipment: String! @col(dataType: "varchar(255)")
  movementPattern: String @col(name: "movement_pattern", dataType: "varchar(255)")
  trainingType: String! @col(name: "training_type", dataType: "varchar(255)") @default(value: "POWER")
}
